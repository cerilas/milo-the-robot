<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1D29"/>
      <stop offset="100%" stop-color="#07080D"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A7F3FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle body -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bg)" stroke="url(#rim)" stroke-width="3"/>

  <!-- Milo glowing eyes -->
  <g filter="url(#glow)">
    <rect x="16" y="22" width="13" height="20" rx="6.5" fill="url(#eye)"/>
    <rect x="35" y="22" width="13" height="20" rx="6.5" fill="url(#eye)"/>
  </g>

  <!-- Subtle specular eye highlights -->
  <rect x="19" y="25" width="4.5" height="2.4" rx="1.2" fill="#FFFFFF" opacity="0.8"/>
  <rect x="38" y="25" width="4.5" height="2.4" rx="1.2" fill="#FFFFFF" opacity="0.8"/>
</svg>
